# 临时验证工作流：只跑 android APK job（desktop-release.yml 的副本，
# 去掉 needs: build），用于快速迭代，验证完成后删除。
# 手动 workflow_dispatch 触发，不创建/触碰任何 Release。

name: Android APK Test

on:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Expo SDK 54（RN 0.81 / Gradle 8.14）：JDK 17 为官方最低要求。
      # 注意必须放在 prebuild 之后：setup-java 的 gradle 缓存以
      # **/*.gradle 文件计算缓存 key，而 android/ 目录由 prebuild 生成。
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install root workspace（共享包类型解析来源）
        run: bun install

      - name: Install mobile deps
        working-directory: apps/mobile
        run: bun install

      - name: 版本同步（app.json ← tag）
        working-directory: apps/mobile
        run: |
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const m = /^v?(\d+)\.(\d+)\.(\d+)/.exec(process.argv[1] || "");
            if (m) {
              app.expo.version = m[1] + "." + m[2] + "." + m[3];
              app.expo.android = app.expo.android || {};
              app.expo.android.versionCode = Number(m[1]) * 10000 + Number(m[2]) * 100 + Number(m[3]);
              fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
            }
            console.log("app.json ->", app.expo.version, "versionCode", app.expo.android.versionCode);
          ' "$GITHUB_REF_NAME"

      - name: Expo prebuild（生成 android/）
        working-directory: apps/mobile
        run: bunx expo prebuild -p android --no-install

      - name: Gradle assembleRelease
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: 重命名 APK
        working-directory: apps/mobile
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "Celery.Todo_${VERSION}_android.apk"
          ls -lh Celery.Todo_*_android.apk

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apps/mobile/Celery.Todo_*_android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
