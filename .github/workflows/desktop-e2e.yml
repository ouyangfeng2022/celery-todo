# 3.0 桌面端 E2E（WebdriverIO + tauri-driver）。
# 驱动真实应用二进制（cargo debug build + WebView2），覆盖
# UI → Tauri 命令 → celery-db 全链路。本地运行会弹真实窗口，
# 按仓库约定仅在 CI 跑（与 2.x Playwright E2E 同策略）。

name: Desktop E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'crates/celery-db/**'
      - 'packages/data/**'
      - 'packages/core/**'
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Tauri smoke (windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install JS deps
        run: bun install

      # 经 Tauri CLI 构建：编译期注入 TAURI_ENV_* 并把 dist 资产嵌入二进制
      #（裸 cargo build 的 debug/release 产物前端空白，见 tauri 官方 webdriver 示例）
      - name: Build desktop binary（tauri build --debug --no-bundle）
        working-directory: apps/desktop
        run: bunx tauri build --debug --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # msedgedriver 必须与本机 WebView2 运行时版本严格匹配（Edge 浏览器版本
      # ≠ WebView2 版本，不匹配时 session 可建立但页面空白/挂起——官方
      # manual-setup 文档指定用 msedgedriver-tool 对版下载到 ~/.cargo/bin）
      - name: Install version-matched msedgedriver（WebView2 runtime）
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"

      - name: Start tauri-driver
        shell: pwsh
        run: |
          $proc = Start-Process tauri-driver -PassThru -WindowStyle Hidden
          $proc.Id | Out-File -FilePath tauri-driver.pid
          # 等待 4444 端口就绪
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            try {
              $null = New-Object Net.Sockets.TcpClient('127.0.0.1', 4444)
              break
            } catch { Start-Sleep -Milliseconds 500 }
          }

      - name: Run WebdriverIO
        working-directory: apps/desktop
        run: bunx wdio run ./e2e/wdio.conf.ts

      - name: Stop tauri-driver
        if: always()
        shell: pwsh
        run: |
          if (Test-Path tauri-driver.pid) {
            Stop-Process -Id (Get-Content tauri-driver.pid) -Force -ErrorAction SilentlyContinue
          }
