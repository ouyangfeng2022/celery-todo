# 3.0 桌面端 E2E（WebdriverIO + tauri-driver）。
# 驱动真实应用二进制（cargo debug build + WebView2），覆盖
# UI → Tauri 命令 → celery-db 全链路。本地运行会弹真实窗口，
# 按仓库约定仅在 CI 跑（与 2.x Playwright E2E 同策略）。

name: Desktop E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'crates/celery-db/**'
      - 'packages/data/**'
      - 'packages/core/**'
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Tauri smoke (windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      - name: Install JS deps
        run: bun install

      - name: Build renderer（turbo：apps/desktop dist）
        run: bun run build

      - name: Build desktop binary（release-e2e：资产嵌入，关 lto 提速）
        run: cargo build --profile release-e2e -p celery-desktop

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Start tauri-driver
        shell: pwsh
        run: |
          $proc = Start-Process tauri-driver -PassThru -WindowStyle Hidden
          $proc.Id | Out-File -FilePath tauri-driver.pid
          # 等待 4444 端口就绪
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            try {
              $null = New-Object Net.Sockets.TcpClient('127.0.0.1', 4444)
              break
            } catch { Start-Sleep -Milliseconds 500 }
          }

      - name: Run WebdriverIO
        working-directory: apps/desktop
        run: bunx wdio run ./e2e/wdio.conf.ts

      - name: Stop tauri-driver
        if: always()
        shell: pwsh
        run: |
          if (Test-Path tauri-driver.pid) {
            Stop-Process -Id (Get-Content tauri-driver.pid) -Force -ErrorAction SilentlyContinue
          }
