# 3.0 桌面端 E2E（WebdriverIO + tauri-driver）。
# 驱动真实应用二进制（cargo debug build + WebView2），覆盖
# UI → Tauri 命令 → celery-db 全链路。本地运行会弹真实窗口，
# 按仓库约定仅在 CI 跑（与 2.x Playwright E2E 同策略）。

name: Desktop E2E

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'crates/celery-db/**'
      - 'packages/data/**'
      - 'packages/core/**'
  workflow_dispatch:

concurrency:
  group: desktop-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Tauri smoke (linux + xvfb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri

      # Tauri Linux 构建全量开发依赖（webkit + GTK + 托盘）+ xvfb 虚拟显示
      - name: Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xvfb

      - name: Install JS deps
        run: bun install

      # 经 Tauri CLI 构建：编译期注入 TAURI_ENV_* 并把 dist 资产嵌入二进制
      #（裸 cargo build 的 debug/release 产物前端空白，见 tauri 官方 webdriver 示例）
      - name: Build desktop binary（tauri build --debug --no-bundle）
        working-directory: apps/desktop
        run: bunx tauri build --debug --no-bundle

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked


      - name: Start tauri-driver
        run: |
          nohup tauri-driver > tauri-driver.log 2>&1 &
          echo $! > tauri-driver.pid
          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/4444) 2>/dev/null && exec 3>&- && break
            sleep 0.5
          done

      # webkit2gtk 在 xvfb 下的已知渲染问题需禁用合成模式
      - name: Run WebdriverIO（xvfb）
        working-directory: apps/desktop
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: xvfb-run -a bunx wdio run ./e2e/wdio.conf.ts

      - name: Stop tauri-driver
        if: always()
        run: |
          [ -f tauri-driver.pid ] && kill "$(cat tauri-driver.pid)" 2>/dev/null || true
          pkill tauri-driver 2>/dev/null || true

      - name: tauri-driver 日志
        if: failure()
        run: cat tauri-driver.log 2>/dev/null || true
