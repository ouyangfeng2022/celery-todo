# E2E 工作流：用 Playwright 驱动真实 Electron 应用做端到端测试。
#
# 触发：仅手动 workflow_dispatch。不再跟随 PR 自动运行——
# 整套串行冷启动耗时很长（单次约 10min+，慢 CI 上还会因 flaky 重试更久），
# 且 main 分支无必检保护，自动跑只会拖慢每个 PR（含纯打包/发版改动）。
# 需要 UI 级验证时由维护者手动触发（如改动 renderer / 主进程行为后）。
#
# 与 ci.yml（lint + vitest unit + build，快速闸门）解耦，单独跑在 windows-latest 上，
# 与 release.yml 的构建目标平台一致（NSIS Windows）。
#
# 数据隔离：每个测试用独立临时 userData 目录（helpers.launchApp 经
# CELERY_TODO_USERDATA 环境变量传给主进程），不污染也不冲突单实例锁。

name: E2E

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright Electron E2E
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # better-sqlite3 是原生 Node 模块，bun install 会按 Node ABI（NODE_MODULE_VERSION 127）
      # 编译，而 Electron 31 用自己的 ABI（125）。E2E 驱动真实 Electron 主进程，
      # 必须用 electron-builder install-app-deps 重新编译为 Electron ABI，否则
      # require('better-sqlite3') 在主进程崩溃，<main> 永不渲染，所有 spec 超时。
      # 与 electron:dev / electron:build 里的 rebuild:electron 保持一致。
      - name: Rebuild native modules for Electron
        run: bun run rebuild:electron

      - name: Install Playwright browsers
        run: bun run e2e:install

      - name: Run E2E tests
        run: bun run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/desktop-electron/playwright-report/
          retention-days: 7

      - name: Upload test artifacts (screenshots/traces/videos)
        uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-test-results
          path: apps/desktop-electron/test-results/
          retention-days: 7
