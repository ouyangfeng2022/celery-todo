# CI 质量门：每次 PR 或推送到 main 时跑 lint + test + build。
# 与 release.yml 解耦 —— 后者由 tag 推送独立触发，不依赖本工作流。
# 失败的 PR 不应合并；推到 main 后失败的话，下一次发版前必须修。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # 排除 tag 推送 —— tag 由 release.yml 处理，不重复跑。
    tags-ignore: ['v*']

# 同一分支/PR 重复推送时取消旧 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Test + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint, --max-warnings 0)
        run: bun run lint

      - name: Test (Vitest)
        run: bun run test:run

      - name: Build (tsc -b + Vite)
        run: bun run build

  # 3.0 数据层：Rust 单测（含 ts-rs 重新生成 TS 绑定）+ 绑定漂移检查。
  # 绑定文件由 cargo test 写入 packages/data/src/generated/，
  # 若与提交版本不一致（有人改了 DTO 但没重新生成），git diff 会失败。
  rust:
    name: Rust tests + bindings drift
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Test celery-db（同时刷新 TS 绑定）
        run: cargo test -p celery-db

      - name: Check Tauri host crate compiles
        run: cargo check -p celery-desktop

      - name: Verify generated bindings are committed
        shell: bash
        run: |
          git diff --exit-code -- packages/data/src/generated \
            || (echo "::error::packages/data/src/generated 与 Rust DTO 不一致；请运行 cargo test -p celery-db 并提交生成物" && exit 1)
