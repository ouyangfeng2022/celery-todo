[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri", "apps/cli"]

[workspace.package]
version = "3.3.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# E2E 专用：release 资产嵌入（debug 构建前端空白）但关 lto 提速
[profile.release-e2e]
inherits = "release"
lto = false
codegen-units = 16
strip = false
